<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pinspot">
	<defs>
		<linearGradient id="ps-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#4f6bff"/>
			<stop offset="1" stop-color="#7b2ff7"/>
		</linearGradient>
		<radialGradient id="ps-gloss" cx="0.26" cy="0.2" r="0.9">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
			<stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="ps-sky" x1="0" y1="150" x2="0" y2="360" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#eaf0ff"/>
			<stop offset="1" stop-color="#dfe4ff"/>
		</linearGradient>
		<linearGradient id="ps-hill-a" x1="0" y1="230" x2="0" y2="372" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#8aa0ff"/>
			<stop offset="1" stop-color="#6f86f5"/>
		</linearGradient>
		<linearGradient id="ps-hill-b" x1="0" y1="250" x2="0" y2="372" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#b9a6ff"/>
			<stop offset="1" stop-color="#9f88f2"/>
		</linearGradient>
		<linearGradient id="ps-dot" x1="272" y1="212" x2="320" y2="260" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#4f6bff"/>
			<stop offset="1" stop-color="#7b2ff7"/>
		</linearGradient>
		<clipPath id="ps-frame"><rect x="88" y="112" width="336" height="288" rx="34"/></clipPath>
		<filter id="ps-cardShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#150c46" flood-opacity="0.30"/>
		</filter>
		<filter id="ps-dotShadow" x="-60%" y="-60%" width="220%" height="220%">
			<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#150c46" flood-opacity="0.35"/>
		</filter>
	</defs>

	<!-- Backdrop -->
	<rect width="512" height="512" rx="116" fill="url(#ps-bg)"/>
	<rect width="512" height="512" rx="116" fill="url(#ps-gloss)"/>

	<!-- Photo card = the image being annotated -->
	<g filter="url(#ps-cardShadow)">
		<rect x="88" y="112" width="336" height="288" rx="34" fill="#ffffff"/>
	</g>
	<g clip-path="url(#ps-frame)">
		<rect x="88" y="112" width="336" height="288" fill="url(#ps-sky)"/>
		<circle cx="168" cy="182" r="34" fill="#ffd98a"/>
		<path d="M88 372 L200 236 L296 372 Z" fill="url(#ps-hill-b)"/>
		<path d="M232 372 L336 244 L452 372 Z" fill="url(#ps-hill-a)"/>
		<!-- secondary hotspot, small, to imply multiple spots -->
		<circle cx="178" cy="330" r="12" fill="#3a5df0" stroke="#ffffff" stroke-width="4"/>
	</g>

	<!-- Primary interactive hotspot: pulse rings + marker -->
	<g>
		<circle cx="316" cy="252" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
		<circle cx="316" cy="252" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6"/>
		<g filter="url(#ps-dotShadow)">
			<circle cx="316" cy="252" r="26" fill="url(#ps-dot)" stroke="#ffffff" stroke-width="6"/>
		</g>
		<circle cx="316" cy="252" r="7" fill="#ffffff"/>
	</g>
</svg>
